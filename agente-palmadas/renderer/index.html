<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: rgba(12, 12, 12, 0.93);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 10px;
      -webkit-app-region: drag;
      user-select: none;
    }

    #status {
      font-size: 17px;
      text-align: center;
      padding: 0 24px;
      color: #e0e0e0;
      line-height: 1.5;
    }

    #hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
    }

    #confirm-dialog {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      border-radius: 18px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 14px;
      z-index: 100;
    }

    #confirm-icon { font-size: 30px; }

    #confirm-reason {
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
      color: rgba(255, 255, 255, 0.8);
    }

    .confirm-buttons {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .confirm-buttons button {
      padding: 8px 26px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid;
      -webkit-app-region: no-drag;
    }

    #btn-deny {
      background: rgba(255, 70, 70, 0.15);
      border-color: rgba(255, 70, 70, 0.4);
      color: #ff8888;
    }

    #btn-allow {
      background: rgba(70, 200, 100, 0.15);
      border-color: rgba(70, 200, 100, 0.4);
      color: #88ff99;
    }
  </style>
</head>
<body>
  <div id="status">😴 IDLE</div>
  <div id="hint">👏👏 dos palmadas para activar</div>

  <div id="confirm-dialog">
    <div id="confirm-icon">⚠️</div>
    <div id="confirm-reason"></div>
    <div class="confirm-buttons">
      <button id="btn-deny">Denegar</button>
      <button id="btn-allow">Permitir</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
